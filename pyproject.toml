[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantvec-cli"
version = "0.1.0"
description = "A CLI tool for vector quantization, compression analysis, and RAG framework adapter generation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "QuantVec Team", email = "quantvec@example.com"}
]
keywords = ["vector", "quantization", "compression", "rag", "embedding", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
langchain = ["langchain>=0.1.0", "langchain-core>=0.1.0"]
llamaindex = ["llama-index>=0.10.0"]
haystack = ["haystack-ai>=2.0.0"]
all = ["quantvec-cli[langchain,llamaindex,haystack]"]

[project.scripts]
quantvec = "quantvec.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/quantvec-cli"
Documentation = "https://github.com/yourusername/quantvec-cli#readme"
Repository = "https://github.com/yourusername/quantvec-cli"
Issues = "https://github.com/yourusername/quantvec-cli/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantvec*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=quantvec --cov-report=term-missing --cov-report=html"
